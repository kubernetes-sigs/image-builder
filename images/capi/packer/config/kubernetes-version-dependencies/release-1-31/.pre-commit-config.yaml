# Dependabot tracking manifest for the 1.31 dependency set.
# Dependabot's pre-commit updater follows the git tags of the repositories
# below and rewrites the matching rev. The pre-commit tool never runs these
# hooks. Regenerate with:
#   images/capi/hack/kubernetes-version-matrix.py render-tracking --write
repos:
  - repo: https://github.com/containerd/containerd
    rev: v2.3.2
    hooks: []
  - repo: https://github.com/containernetworking/plugins
    rev: v1.5.1
    hooks: []
  - repo: https://github.com/opencontainers/runc
    rev: v1.4.3
    hooks: []
  - repo: https://github.com/kubernetes/kubernetes
    rev: v1.31.14
    hooks: []
  - repo: https://github.com/kubernetes-sigs/cri-tools
    rev: v1.31.1
    hooks: []
