---
# Pin the Python interpreter to the versionless symlink so that it
# survives tdnf distro-sync upgrading the Python version (e.g. 3.11→3.12),
# which removes the old versioned binary that Ansible auto-discovered.
- name: Pin ansible_python_interpreter to /usr/bin/python3
  ansible.builtin.set_fact:
    ansible_python_interpreter: /usr/bin/python3

- name: Add bash_profile
  ansible.builtin.template:
    dest: /home/builder/.bash_profile
    src: photon_bash_profile
    mode: "0600"
    owner: builder
    group: builder

- name: Import RPM repository tasks
  ansible.builtin.import_tasks: rpm_repos.yml

- name: Update the repos package to import the recent gpg keys
  ansible.builtin.command: tdnf update -y photon-repos --enablerepo=photon --refresh
  register: distro
  changed_when: '"Nothing to do" not in distro.stderr'
  when: not (disable_public_repos | default(false, true) | bool)

# Keep the GA ISO's cloud-init and open-vm-tools explicit in the transaction
# so replacing their old net-tools dependency cannot erase them.
- name: Replace Photon 5 net-tools while retaining VMware bootstrap packages
  ansible.builtin.command: tdnf install -y --refresh --allowerasing hostname toybox cloud-init open-vm-tools
  register: setup_network_tools
  changed_when: '"Nothing to do" not in setup_network_tools.stderr'
  when: ansible_facts['distribution_major_version'] == "5"

- name: Replace chkconfig with alternatives to satisfy iptables dependency
  ansible.builtin.command: tdnf install -y alternatives --allowerasing
  register: install_alternatives
  changed_when: '"Nothing to do" not in install_alternatives.stderr'

# Keep Photon 5's explicitly refreshed public repo package: the default repo
# can offer an older build that disables the repositories on replacement.
- name: Perform a tdnf distro-sync
  ansible.builtin.command: >-
    tdnf distro-sync -y --refresh
    {{ '--exclude=photon-repos'
       if ansible_facts['distribution_major_version'] == '5'
         and not (disable_public_repos | default(false, true) | bool)
       else '' }}
  register: distro
  changed_when: '"Nothing to do" not in distro.stderr'

- name: Concatenate the Photon RPMs
  ansible.builtin.set_fact:
    photon_rpms: "{{ rpms | join(' ') }}"

- name: Install baseline dependencies
  ansible.builtin.command: tdnf install {{ photon_rpms }} -y
  when: photon_rpms != ""

- name: Install extra RPMs
  ansible.builtin.command: tdnf install {{ extra_rpms }} -y
  when: extra_rpms != ""

# Default size of 1G is insufficient when downloading additional components
- name: Increase tmpfs size
  ansible.posix.mount:
    path: /tmp
    src: tmpfs
    fstype: tmpfs
    opts: size=5G
    state: remounted

- name: Reset iptables rules input
  ansible.builtin.replace:
    path: /etc/systemd/scripts/ip4save
    regexp: INPUT DROP
    replace: INPUT ACCEPT

- name: Reset ip6tables rules input
  ansible.builtin.replace:
    path: /etc/systemd/scripts/ip6save
    regexp: INPUT DROP
    replace: INPUT ACCEPT
