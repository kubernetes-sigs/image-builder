# Kubernetes version matrix rolling latest
- directories:
    - "/images/capi/packer/config/kubernetes-version-dependencies/latest"
  package-ecosystem: "pre-commit"
  open-pull-requests-limit: 3
  schedule:
    interval: "weekly"
    time: "09:00"
    # Use America/New_York Standard Time (UTC -05:00)
    timezone: "America/New_York"
  groups:
    kubernetes-version-matrix-latest:
      patterns: [ "*" ]
  ignore:
    # The rolling entry may move to a newer minor, never to a new major.
    - dependency-name: "https://github.com/containerd/containerd"
      versions: [ ">= 3.0.0" ]
    - dependency-name: "https://github.com/containernetworking/plugins"
      versions: [ ">= 2.0.0" ]
    - dependency-name: "https://github.com/opencontainers/runc"
      versions: [ ">= 2.0.0" ]
    - dependency-name: "https://github.com/kubernetes/kubernetes"
      versions: [ ">= 2.0.0" ]
    - dependency-name: "https://github.com/kubernetes-sigs/cri-tools"
      versions: [ ">= 2.0.0" ]
  commit-message:
    prefix: "dependabot"
    include: scope
  labels:
    - "ok-to-test"
    - "kind/cleanup"
    - "release-note-none"
