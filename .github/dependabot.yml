# Please see the documentation for all configuration options: https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:

# github-actions
- directory: "/"
  package-ecosystem: "github-actions"
  open-pull-requests-limit: 5
  schedule:
    interval: "weekly"
    time: "09:00"
    # Use America/New_York Standard Time (UTC -05:00)
    timezone: "America/New_York"
  groups:
    all-github-actions:
      patterns: [ "*" ]
  commit-message:
    prefix: "dependabot"
    include: scope
  labels:
    - "ok-to-test"
    - "kind/cleanup"
    - "release-note-none"

# Kubernetes version matrix tracking manifests.
# One entry per directory: the ignore ranges below hold each pinned
# repository to the pin policy of its directory, and those ranges differ
# per directory, so a single globbed entry cannot express them. The ranges are
# hand-maintained; verify reports the value to write after a pin changes:
#   images/capi/hack/kubernetes-version-matrix.py verify

# Kubernetes version matrix release pin 1.31
- directories:
    - "/images/capi/packer/config/kubernetes-version-dependencies/release-1-31"
  package-ecosystem: "pre-commit"
  open-pull-requests-limit: 5
  schedule:
    interval: "weekly"
    time: "09:00"
    # Use America/New_York Standard Time (UTC -05:00)
    timezone: "America/New_York"
  groups:
    kubernetes-version-matrix-release-1-31:
      patterns: [ "*" ]
  ignore:
    # Release pins take patch updates only.
    - dependency-name: "https://github.com/containerd/containerd"
      versions: [ ">= 2.4.0" ]
    - dependency-name: "https://github.com/containernetworking/plugins"
      versions: [ ">= 1.6.0" ]
    - dependency-name: "https://github.com/opencontainers/runc"
      versions: [ ">= 1.5.0" ]
    - dependency-name: "https://github.com/kubernetes/kubernetes"
      versions: [ ">= 1.32.0" ]
    - dependency-name: "https://github.com/kubernetes-sigs/cri-tools"
      versions: [ ">= 1.32.0" ]
  commit-message:
    prefix: "dependabot"
    include: scope
  labels:
    - "ok-to-test"
    - "kind/cleanup"
    - "release-note-none"

